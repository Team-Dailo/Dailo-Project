name: "CD: Deploy to ECS (Prod)"

on:
  # 인프라 워크플로우 완료 후(성공 조건은 job if에서 검증)
  workflow_run:
    workflows: ["Terraform Infrastructure"] 
    types:
      - completed
    branches: ["main"]
  # 백엔드 코드 변경 시 직접 배포 실행
  push:
    branches: [ "main" ] 
    paths:
      - "backend/**"
      - ".github/workflows/cd-prod-deploy.yml"

permissions:
  contents: read # 소스 코드 읽기 권한
  id-token: write # JWT 토큰 발급 권한

jobs:
  deploy:
    name: Build & Deploy to ECS
    runs-on: ubuntu-latest
    # push 또는 성공한 terraform(workflow_run)일 때만 배포
    if: |
      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )

    steps:
      # 1) 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v3

      # 2) 빌드 환경 준비 (JDK)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      
      # 3) Gradle 실행 권한 부여
      - name: Grant execute permission for gradlew
        working-directory: ./backend
        run: chmod +x gradlew 
      
      # 4) 배포용 산출물 빌드 (테스트는 PR CI에서 검증)
      - name: Build deploy artifact 
        working-directory: ./backend
        run: ./gradlew clean build -x test

      # 5) AWS 인증
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GHA_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-cd-prod
          aws-region: ap-northeast-2
      
      # 6) 인프라 준비 상태 확인 (ECS 클러스터)
      - name: Check Infrastructure Readiness
        run: |
          echo "Checking if ECS cluster 'dailo-cluster' exists and is ACTIVE..."
          CLUSTER_STATUS=$(aws ecs describe-clusters --clusters dailo-cluster --query "clusters[0].status" --output text)
          
          if [ "$CLUSTER_STATUS" != "ACTIVE" ]; then
            echo "Error: ECS Cluster 'dailo-cluster' is not ACTIVE or does not exist."
            exit 1
          fi

      # 7) ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # 8) Docker 이미지 빌드/푸시 후 digest 기반 이미지 URI 생성
      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        working-directory: ./backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: dailo 
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"
          IMAGE_TAG_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          IMAGE_LATEST_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker build -t "$IMAGE_TAG_URI" .
          docker tag "$IMAGE_TAG_URI" "$IMAGE_LATEST_URI"
          docker push "$IMAGE_TAG_URI"
          docker push "$IMAGE_LATEST_URI"

          IMAGE_DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query "imageDetails[0].imageDigest" \
            --output text)

          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY@$IMAGE_DIGEST"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
          echo "Using image digest: $IMAGE_URI"

      # 9) 현재 실행 중인 Task Definition 다운로드
      - name: Download current task definition
        run: |
          CURRENT_TD_ARN=$(aws ecs describe-services \
            --cluster dailo-cluster \
            --services dailo-service \
            --query "services[0].taskDefinition" \
            --output text)

          aws ecs describe-task-definition \
            --task-definition "$CURRENT_TD_ARN" \
            --query taskDefinition > task-definition.json

      # 10) 새 이미지 digest를 Task Definition에 반영
      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: dailo-container
          image: ${{ env.IMAGE_URI }}

      # 11) ECS 서비스에 새 Task Definition 배포
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: dailo-service
          cluster: dailo-cluster
          wait-for-service-stability: true
