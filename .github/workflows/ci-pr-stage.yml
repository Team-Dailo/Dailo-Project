name: "CI: PR Check (Stage)"

on:
  # PR 기준 백엔드 코드 변경 시 CI 실행
  pull_request: 
    branches: [ "stage" ]
    paths:
      - "backend/**"
      - ".github/workflows/ci-pr-stage.yml"

jobs:
  build-and-test: 
    name: Build and Check
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: dailo_test
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      # 1) 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v3

      # 2) 빌드 환경 준비 (JDK)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3) Gradle 실행 권한 부여
      - name: Grant execute permission for gradlew
        working-directory: ./backend
        run: chmod +x gradlew
      
      # 4) 빌드 + 테스트 실행
      - name: Build with Gradle
        working-directory: ./backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3307/dailo_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&createDatabaseIfNotExist=true
          DB_USERNAME: root
          DB_PASSWORD: testpassword
        run: ./gradlew clean build
