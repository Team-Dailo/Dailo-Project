name: "CD: iOS TestFlight"

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Optional app version override (for example: 4.2.6)"
        required: false
        type: string
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/ios-appstore-deploy.yml"

permissions:
  contents: read

# Never run two App Store builds at the same time. A queued release must not be
# cancelled because EAS may already have incremented its remote build number.
concurrency:
  group: ios-testflight-production
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: Build with EAS and submit to TestFlight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./frontend
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APP_VERSION: ${{ github.event.inputs.version_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Validate deployment configuration
        run: |
          test -n "$EXPO_TOKEN" || {
            echo "Missing GitHub Actions secret: EXPO_TOKEN"
            exit 1
          }
          test "$(node -p "require('./app.json').expo.ios.bundleIdentifier")" = "com.knut.dailo"
          test "$(node -p "require('./app.json').expo.ios.supportsTablet")" = "true"
          test "$(node -p "require('./eas.json').submit.production.ios.ascAppId")" = "6759860699"

      - name: Build production IPA and submit to TestFlight
        run: eas build --platform ios --profile production --auto-submit --non-interactive --no-wait
