name: "Terraform Infrastructure"

on:
  # 수동 실행
  workflow_dispatch:
  # stage 브랜치 인프라 변경 시 실행
  push:
    branches: ["stage"]

  # stage 대상 PR에서 plan 검증
  pull_request:
    branches: ["stage"]

permissions:
  contents: read # 소스 코드 읽기 권한
  id-token: write # JWT 토큰 발급 권한

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./infra/terraform/live/stage/

    steps:
      # 1) 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v3

      # 2) Terraform CLI 준비
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      # 2-1) AWS 인증 (OIDC AssumeRole)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GHA_TERRAFORM_ROLE_ARN }}
          role-session-name: github-actions-tf-stage
          aws-region: ap-northeast-2
        
      # 3) 초기화 (backend/provider/module 다운로드)
      - name: Terraform Init
        run: terraform init
      
      # 4) PR에서는 Plan으로 변경사항 검증
      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }} 
          TF_VAR_discord_webhook_url: ${{ secrets.TF_VAR_DISCORD_WEBHOOK_URL }}
          TF_VAR_grafana_admin_password: ${{ secrets.TF_VAR_GRAFANA_ADMIN_PASSWORD }}
        run: terraform plan -no-color

      # 5) stage push에서는 Apply 실행
      - name: Terraform Apply
        if: |
          (github.ref == 'refs/heads/stage' && github.event_name == 'push') ||
          github.event_name == 'workflow_dispatch'
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
          TF_VAR_discord_webhook_url: ${{ secrets.TF_VAR_DISCORD_WEBHOOK_URL }}
          TF_VAR_grafana_admin_password: ${{ secrets.TF_VAR_GRAFANA_ADMIN_PASSWORD }}
        run: terraform apply -auto-approve
