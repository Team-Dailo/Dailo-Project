name: "Destroy Stage Infrastructure"

on:
  # 수동 실행으로만 삭제 허용
  workflow_dispatch: 
    inputs:
      confirm:
        description: "진짜 삭제하시겠습니까? (삭제하려면 'yes' 입력)"
        required: true
        default: "no"

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    name: "Destroy Stage"
    runs-on: ubuntu-latest
    # confirm=yes일 때만 실제 삭제 수행
    if: ${{ github.event.inputs.confirm == 'yes' }}

    defaults:
      run:
        working-directory: ./infra/terraform/live/stage/

    steps:
      # 1) 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v3

      # 2) Terraform CLI 준비
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.10.0
        
      # 3) AWS 인증
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GHA_TERRAFORM_ROLE_ARN }}
          role-session-name: github-actions-destroy-stage
          aws-region: ap-northeast-2

      # 4) Terraform 초기화
      - name: Terraform Init
        run: terraform init

      # 5) Terraform Destroy 실행
      - name: Terraform Destroy
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }} 
          TF_VAR_discord_webhook_url: ${{ secrets.TF_VAR_DISCORD_WEBHOOK_URL }}
          TF_VAR_grafana_admin_password: ${{ secrets.TF_VAR_GRAFANA_ADMIN_PASSWORD }}
        run: terraform destroy -auto-approve
