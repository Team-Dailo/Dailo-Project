name: "CI: PR Check (Main)"

on:
  # PR 기준 백엔드 코드 변경 시 CI 실행
  pull_request: 
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/ci-pr-prod.yml"

jobs:
  build-and-test:
    name: Build and Check
    runs-on: ubuntu-latest

    steps:
      # 1) 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v3

      # 2) 빌드 환경 준비 (JDK)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3) Gradle 실행 권한 부여
      - name: Grant execute permission for gradlew
        working-directory: ./backend
        run: chmod +x gradlew
      
      # 4) 빌드 + 테스트 실행
      - name: Build with Gradle
        working-directory: ./backend
        run: ./gradlew clean build
