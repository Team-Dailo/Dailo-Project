spring.application.name=backend
# Server Port
server.port=8080

# MySQL Connection
spring.datasource.url=jdbc:mysql://localhost:3306/dailo?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Timezone (JVM 기본 타임존은 BackendApplication.main에서 Asia/Seoul로 설정)
spring.jackson.time-zone=Asia/Seoul

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-validity-in-seconds=1800  
# 30?
jwt.refresh-token-validity-in-seconds=604800
# 7?

# 관리자 권한 (회원 목록·행사별 좋아요 등): DB에서 role=ADMIN이 아니어도 아래에 넣으면 접근 가능
# 이메일 또는 회원 ID를 쉼표로 구분해 입력 (예: admin@example.com 또는 1,2,3)
app.admin.emails=
app.admin.user-ids=

# AWS S3 / S3 호환(R2)
# 버킷: KoDeploy가 주입하는 S3_BUCKET(앱당 버킷) 우선, 없으면 AWS_S3_BUCKET, 그것도 없으면 기본값
cloud.aws.s3.bucket=${S3_BUCKET:${AWS_S3_BUCKET:dailo-uploads}}
# S3 호환 엔드포인트(R2). 비어 있으면 표준 AWS S3. KoDeploy가 S3_ENDPOINT로 주입.
cloud.aws.s3.endpoint=${S3_ENDPOINT:}
# 공개 객체 서빙 베이스 URL(R2 public 도메인). 비어 있으면 CloudFront /static 동작 유지.
cloud.aws.s3.public-base-url=${S3_PUBLIC_BASE_URL:}

# 업로드: 배포환경에서는 S3 사용. APP_UPLOAD_USE_S3=true, APP_UPLOAD_STATIC_BASE_PATH=/static
app.upload.use-s3=${APP_UPLOAD_USE_S3:false}
app.upload.static-base-path=${APP_UPLOAD_STATIC_BASE_PATH:/static}
# region: KoDeploy/R2는 AWS_REGION=auto 주입. AWS는 ap-northeast-2.
cloud.aws.region=${AWS_REGION:ap-northeast-2}
cloud.aws.s3.presigned-url-expiration-minutes=60

# Multipart
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Festival Crawler API
crawler.api.url=${CRAWLER_API_URL:http://localhost:8000}
crawler.api.year=2025
crawler.api.region=\uCDA9\uC8FC\uC2DC

# OAuth2 Kakao
# 1. ????? ?? (??? ??)
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
#spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.redirect-uri=https://dailoapp.com/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,profile_image

# 2. ??? API ?? ?? (??? ??? ??)
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# ???(CloudFront, Nginx ?)? ???? X-Forwarded-* ??? ????? ??
server.forward-headers-strategy=framework

# Mail (Gmail SMTP - Dev/Test)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# optional: ?? From / ??? URL
app.mail.from=${MAIL_FROM:no-reply@dailoapp.com}
app.front-base-url=${FRONT_BASE_URL:http://localhost:8080}

# Cache (Caffeine) - 캐시별 TTL은 CacheConfig.java에서 관리
spring.cache.type=caffeine

# 버스 공공API
bus.api.key=${BUS_API_KEY}
bus.api.key-encoded=${BUS_API_KEY_ENCODED}
bus.api.base-url=https://apis.data.go.kr/1613000
bus.api.stop-dataset-url=https://api.odcloud.kr/api/15067528/v1/uddi:f74b9799-9db1-4754-a5d0-b66e2ae705f3
