spring.application.name=backend
# Server Port
server.port=8080

# MySQL Connection
spring.datasource.url=jdbc:mysql://localhost:3306/dailo?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT
jwt.secret=vmfhaltkfkdgodyroqkfwkdbalroqkfwkdbalsucvmfhaltkfkdgodyroqkfwkdbalroqkfwkdbalsucvmfhaltkfkdgodyroqkfwkdbalroqkfwkdbalsuc
jwt.access-token-validity-in-seconds=1800  
# 30?
jwt.refresh-token-validity-in-seconds=604800
# 7?

# 관리자 권한 (회원 목록·행사별 좋아요 등): DB에서 role=ADMIN이 아니어도 아래에 넣으면 접근 가능
# 이메일 또는 회원 ID를 쉼표로 구분해 입력 (예: admin@example.com 또는 1,2,3)
app.admin.emails=
app.admin.user-ids=

# S3 업로드 (AWS_S3_BUCKET 환경변수 있으면 자동 활성화)
app.s3.bucket=${AWS_S3_BUCKET:}
app.s3.region=${AWS_REGION:ap-northeast-2}
# CDN base URL (선택, 예: https://stage.dailoapp.com)
app.s3.base-url=