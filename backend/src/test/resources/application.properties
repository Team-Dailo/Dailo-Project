# Test Database (MySQL - dailo_test)
spring.datasource.url=jdbc:mysql://localhost:3307/dailo_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}

# JPA Settings for Test
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT (테스트용)
jwt.secret=vmfhaltkfkdgodyroqkfwkdbalroqkfwkdbalsucvmfhaltkfkdgodyroqkfwkdbalroqkfwkdbalsucvmfhaltkfkdgodyroqkfwkdbalroqkfwkdbalsuc
jwt.access-token-validity-in-seconds=1800
jwt.refresh-token-validity-in-seconds=604800

# Logging
logging.level.org.hibernate.SQL=DEBUG

# AWS S3 (test dummy)
cloud.aws.credentials.access-key=dummy
cloud.aws.credentials.secret-key=dummy
cloud.aws.region=ap-northeast-2
cloud.aws.s3.bucket=dummy-bucket
cloud.aws.s3.presigned-url-expiration-minutes=60

# Upload settings
app.upload.use-s3=false
app.upload.static-base-path=/static

# Kakao OAuth (test dummy)
spring.security.oauth2.client.registration.kakao.client-id=test-client-id
spring.security.oauth2.client.registration.kakao.client-secret=test-client-secret
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,profile_image
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

